name: "Filter changes"
description: "Filter a JSON array of changed files with one GitHub Actions path pattern."
branding:
  icon: filter
  color: green
inputs:
  filter:
    description: "One path pattern. The action evaluates each changed file independently against this pattern."
    required: true
  changes:
    description: "JSON array of changed files (from anttiharju/find-changes-action)"
    required: true
  debug:
    description: "Enable compare-changes --debug output (true/false)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Prepare cache
      id: check
      shell: sh
      env:
        VERSION: "0.13.1"
      run: |
        "$GITHUB_ACTION_PATH/scripts/cache.sh"
    - name: Generate target triple
      id: target
      shell: sh
      env:
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/target.sh"
    - if: steps.check.outputs.installed != 'true'
      name: Cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.check.outputs.directory }}/compare-changes
        key: compare-changes_0.13.1_${{ steps.target.outputs.triple }}
    - if: steps.check.outputs.installed != 'true' && steps.cache.outputs.cache-hit != 'true'
      name: Download executable
      working-directory: ${{ steps.check.outputs.directory }}
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: "0.13.1"
        TARGET: ${{ steps.target.outputs.triple }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/install.sh"
    - name: Verify checksum
      shell: sh
      env:
        BINARY: "${{ steps.check.outputs.directory }}/compare-changes"
        TARGET: ${{ steps.target.outputs.triple }}
        MACOS_ARM_SHA: "8025d2e8c81324848f9763f96ebfc3e52899f84cd6a8d6d4ef29d7f417942e9e"
        LINUX_ARM_SHA: "d658fdfd373b275558644c941096c31ccb1fba68abd831a017cf2c9cf8d7fa85"
        LINUX_X64_SHA: "e1e930b2a9bcec46a031852686e8f3429f9b1dd4d20cdee53d5df4ce63735dd0"
      run: |
        "$GITHUB_ACTION_PATH/scripts/verify.sh"
    - name: Filter changes
      id: run
      shell: bash
      env:
        BINARY: "${{ steps.check.outputs.directory }}/compare-changes"
        FILTER: "${{ inputs.filter }}"
        CHANGES: "${{ inputs.changes }}"
        DEBUG: "${{ inputs.debug }}"
      run: |
        "$GITHUB_ACTION_PATH/scripts/run.sh"
outputs:
  array:
    description: "JSON array of changed files that match the path pattern."
    value: ${{ steps.run.outputs.array }}
